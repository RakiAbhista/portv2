name: Deploy to RupaCloud (Next.js)

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Auto-Deploy to Container
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # Off-host Frontend Builder: Kompilasi aset berat di Cloud Runner (4 vCPU, 7GB RAM)
      - name: ⚡ Persiapan Node.js untuk Cloud Build
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Build Frontend Assets di Cloud Runner (Off-host Builder)
        if: hashFiles('package.json') != ''
        run: |
          echo "🚀 Memulai kompilasi aset frontend di Cloud Runner (4 vCPU, 7GB RAM NVMe)..."
          npm ci || npm install
          npm run build
          # Kompres output build (public/build untuk Laravel, dist untuk Vite SPA, .next untuk Next.js)
          if [ -d public/build ]; then
            tar -czf /tmp/rupacloud_build_assets.tar.gz public/build
            echo "✔ Aset public/build berhasil dikompilasi di Cloud Runner."
          elif [ -d dist ]; then
            tar -czf /tmp/rupacloud_build_assets.tar.gz dist
            echo "✔ Aset dist berhasil dikompilasi di Cloud Runner."
          elif [ -d .next ]; then
            tar -czf /tmp/rupacloud_build_assets.tar.gz .next
            echo "✔ Aset .next berhasil dikompilasi di Cloud Runner."
          fi

      - name: 🌐 Persiapan Koneksi Cloudflare SSH (Bypass NAT/Firewall)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if echo "${{ secrets.SERVER_IP }}" | grep -qE '.[a-zA-Z]{2,}$'; then
            echo "Mengunduh client Cloudflare Tunnel untuk koneksi SSH..."
            sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
            sudo chmod +x /usr/local/bin/cloudflared
            echo -e "Host *\n  ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null" > ~/.ssh/config
          else
            echo "Menggunakan koneksi IP langsung."
          fi

      - name: 🚀 SSH to RupaCloud Container & Deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_IP }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          APP_ENV_CONTENT: ${{ secrets.APP_ENV }}
        run: |
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          APP_ENV_B64=$(echo -n "$APP_ENV_CONTENT" | base64 -w 0)

          # 1. Sinkronisasi repositori git ke container
          ssh -i ~/.ssh/deploy_key -p $SERVER_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=60 -o BatchMode=yes root@$SERVER_HOST "bash -s" << 'REMOTE_SYNC_EOF'
            set -e
            export GIT_TERMINAL_PROMPT=0
            pkill -f 'npm run build' 2>/dev/null || true
            pkill -f 'vite build' 2>/dev/null || true

            TARGET_REPO="${{ github.repository }}"
            CURRENT_REPO="$(cd ~/app 2>/dev/null && git config --get remote.origin.url 2>/dev/null || true)"
            if [ ! -d ~/app/.git ] || ! echo "$CURRENT_REPO" | grep -q "$TARGET_REPO"; then
              rm -rf ~/app
              git clone --depth 1 -b main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ~/app
            else
              cd ~/app
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch --depth 1 origin main
              git checkout -B main FETCH_HEAD
              git reset --hard FETCH_HEAD
              git clean -fd
            fi
          REMOTE_SYNC_EOF

          # 2. Transfer artefak hasil kompilasi Cloud Runner ke container jika tersedia
          if [ -f /tmp/rupacloud_build_assets.tar.gz ]; then
            echo "🚀 Mentransfer artefak hasil build dari Cloud Runner ke container..."
            cat /tmp/rupacloud_build_assets.tar.gz | ssh -i ~/.ssh/deploy_key -p $SERVER_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=60 -o BatchMode=yes root@$SERVER_HOST "tar -xzf - -C ~/app/"
          fi

          # 3. Eksekusi setup dependensi, env, migrate, dan runtime PM2 di container
          ssh -i ~/.ssh/deploy_key -p $SERVER_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=60 -o BatchMode=yes root@$SERVER_HOST "APP_ENV_B64="$APP_ENV_B64" bash -s" << 'REMOTE_SCRIPT_EOF'
            set -e
            cd ~/app

            # 2. Injeksi environment variables dari secrets
            if [ -n "$APP_ENV_B64" ]; then
              echo "$APP_ENV_B64" | base64 -d > .env
            fi
            sed -i 's/\\n/\n/g' .env 2>/dev/null || true

            # 3. Instalasi dependensi
            if [ ! -d .next ]; then npm install; else npm install --omit=dev 2>/dev/null || npm install; fi

            # 4. Persiapan ORM & framework cache
            if [ -f prisma/schema.prisma ] || grep -q '"prisma"' package.json 2>/dev/null; then
              npx prisma generate 2>/dev/null || true
            fi
            if [ -f artisan ]; then
              if [ ! -f .env ]; then cp .env.example .env 2>/dev/null || touch .env; fi
              sed -i 's/\\n/\n/g' .env 2>/dev/null || true
              if ! grep -q '^APP_KEY=.\+' .env 2>/dev/null; then
                if ! grep -q '^APP_KEY=' .env 2>/dev/null; then echo '' >> .env; echo 'APP_KEY=' >> .env; fi
                php artisan key:generate --force 2>/dev/null || true
              fi
              php artisan config:clear 2>/dev/null || true
            fi

            # 5. Build & kompilasi aplikasi
            export NODE_OPTIONS="--max-old-space-size=350"
            if [ -d .next ]; then echo '✔ Menggunakan build .next dari Cloud Runner.'; else NODE_OPTIONS='--max-old-space-size=400 --optimize-for-size' npm run build; fi

            # 6. Konfigurasi Nginx reverse proxy
            if which nginx >/dev/null 2>&1; then
              echo "" | base64 -d > /etc/nginx/sites-available/default
              nginx -t 2>/dev/null && systemctl reload nginx 2>/dev/null || true
            fi

            # 7. Menjalankan proses aplikasi via PM2 & auto-resurrect on reboot
            if ! which pm2 >/dev/null 2>&1; then
              if ! which node >/dev/null 2>&1; then
                curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && apt-get install -y -qq nodejs
              fi
              npm install -g pm2 --silent 2>/dev/null || true
            fi
            pm2 delete app 2>/dev/null || true
            pm2 delete app 2>/dev/null || true; pm2 start npm --name app -- start -- -p 3000
            pm2 save 2>/dev/null || true
            pm2 startup systemd -u root --hp /root 2>/dev/null || true
            systemctl enable pm2-root 2>/dev/null || true

            echo "✔ Aplikasi berhasil diperbarui dan aktif berjalan di port 3000."
          REMOTE_SCRIPT_EOF
          rm -f ~/.ssh/deploy_key

      - name: 📊 Ringkasan Status Deployment (RuPa Cloud Summary)
        if: success()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## ☁️ RuPa Cloud - Ringkasan Deployment
          ### ✅ Deployment Berhasil!
          Aplikasi **Next.js** berhasil diperbarui dan aktif berjalan di container RuPa Cloud.

          | Parameter | Informasi |
          | :--- | :--- |
          | 📦 Framework | Next.js |
          | 🌿 Branch | main |
          | 🔖 Commit SHA | ${{ github.sha }} |
          | 👤 Dipicu Oleh | ${{ github.actor }} |
          | ⏱️ Waktu Selesai | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |
          EOF

      - name: ⚠️ Ringkasan Kegagalan Deployment
        if: failure()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## ☁️ RuPa Cloud - Ringkasan Deployment
          ### ❌ Deployment Gagal!
          Terjadi kendala saat proses deployment di container. Silakan periksa log step **🚀 SSH to RupaCloud Container & Deploy** di atas untuk melihat detail kesalahannya.
          EOF
